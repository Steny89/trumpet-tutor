<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      body {
        margin: 0;
        padding: 15px;
        background-color: #f5f7fa;
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #2c3e50;
        height: 95vh;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.05);
        box-sizing: border-box;
        margin-bottom: 15px;
      }
      .title {
        font-size: 18px;
        font-weight: bold;
        color: #2c3e50;
      }
      .card {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 12px;
        width: 100%;
        max-width: 350px;
        box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .dropdown {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        margin-bottom: 10px;
        background: #f8fafc;
      }
      .note-display {
        font-size: 42px;
        font-weight: bold;
        color: #2980b9;
        margin: 5px 0;
      }
      .pitch-hz {
        font-size: 14px;
        color: #7f8c8d;
        margin-bottom: 10px;
        font-weight: 500;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        width: 100%;
        margin-top: 10px;
      }
      .btn {
        background-color: #27ae60;
        color: white;
        border: none;
        padding: 12px 14px;
        font-size: 14px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        flex: 1;
      }
      .btn-stop {
        background-color: #c0392b;
      }

      .chat-container {
        width: 100%;
        margin-top: 15px;
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.05);
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        font-size: 13px;
        text-align: left;
        margin-bottom: 10px;
        padding-right: 5px;
        min-height: 100px;
      }
      .msg {
        margin: 5px 0;
        padding: 8px;
        border-radius: 8px;
      }
      .ai {
        background: #ebf5fb;
        border-left: 3px solid #2980b9;
        color: #154360;
      }
      .user {
        background: #f4f6f7;
        text-align: right;
        color: #2c3e50;
      }
      .chat-input-row {
        display: flex;
        gap: 5px;
      }
      .chat-input {
        flex: 1;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
      }
      .chat-btn {
        background: #2980b9;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">Trumpet Tutor 🎺</div>
      <div style="font-size: 12px; font-weight: bold; color: #16a085">
        Active Practice
      </div>
    </div>

    <div class="card">
      <div
        style="
          font-size: 12px;
          font-weight: bold;
          text-align: left;
          width: 100%;
          color: #64748b;
          margin-bottom: 4px;
        "
      >
        Target Note:
      </div>
      <select id="noteSelector" class="dropdown">
        <option value="Bb3">Bb3 (Valves: 1)</option>
        <option value="C4 (Middle C)" selected>C4 (Middle C) [Open]</option>
        <option value="G4">G4 (Open)</option>
        <option value="C5 (High C)">C5 (High C) [Open]</option>
      </select>

      <div class="note-display" id="noteDisplay">--</div>
      <div class="pitch-hz" id="pitchDisplay">Click to start listener</div>

      <div class="btn-group">
        <button class="btn" id="startBtn" onclick="startAudio()">
          Enable Listener
        </button>
        <button
          class="btn btn-stop"
          id="stopBtn"
          onclick="stopAudio()"
          style="display: none"
        >
          Stop Listener
        </button>
      </div>
    </div>

    <div class="chat-container">
      <div
        style="
          font-size: 13px;
          font-weight: bold;
          color: #2980b9;
          margin-bottom: 5px;
        "
      >
        🤖 AI Practice Coach
      </div>
      <div class="chat-log" id="chatLog">
        <div class="msg ai">
          Hi! Enable the listener above, or ask me for embouchure and breathing
          tips.
        </div>
      </div>
      <div class="chat-input-row">
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Ask a question..."
        />
        <button class="chat-btn" onclick="sendChat()">Send</button>
      </div>
    </div>

    <script>
      let mediaStream = null;
      let audioCtx = null;
      let analyser = null;
      let isListening = false;

      function getNoteName(frequency) {
        const notes = [
          "C",
          "C#",
          "D",
          "Eb",
          "E",
          "F",
          "F#",
          "G",
          "Ab",
          "A",
          "Bb",
          "B",
        ];
        const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
        const midiNote = Math.round(noteNum) + 69;
        return notes[midiNote % 12];
      }

      function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let sumOfSquares = 0;
        for (let i = 0; i < SIZE; i++) sumOfSquares += buf[i] * buf[i];
        let rootMeanSquare = Math.sqrt(sumOfSquares / SIZE);
        if (rootMeanSquare < 0.01) return -1;

        let r1 = 0,
          r2 = SIZE - 1,
          threshold = 0.2;
        for (let i = 0; i < SIZE / 2; i++) {
          if (Math.abs(buf[i]) < threshold) {
            r1 = i;
            break;
          }
        }
        for (let i = 1; i < SIZE / 2; i++) {
          if (Math.abs(buf[SIZE - i]) < threshold) {
            r2 = SIZE - i;
            break;
          }
        }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;
        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++) {
          for (let j = 0; j < SIZE - i; j++) {
            c[i] = c[i] + buf[j] * buf[j + i];
          }
        }
        let d = 0;
        while (c[d] > c[d + 1]) d++;
        let maxval = -1,
          maxpos = -1;
        for (let i = d; i < SIZE; i++) {
          if (c[i] > maxval) {
            maxval = c[i];
            maxpos = i;
          }
        }
        return sampleRate / maxpos;
      }

      window.sendChat = function () {
        const input = document.getElementById("chatInput");
        const log = document.getElementById("chatLog");
        if (!input.value) return;
        log.innerHTML += '<div class="msg user">' + input.value + "</div>";
        setTimeout(() => {
          log.innerHTML +=
            '<div class="msg ai">Keep your air support steady and corners firm!</div>';
          log.scrollTop = log.scrollHeight;
        }, 500);
        input.value = "";
      };

      window.startAudio = async function () {
        try {
          document.getElementById("pitchDisplay").innerText =
            "Requesting mic...";
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error(
              "Microphone API not available in this view context.",
            );
          }
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") {
            await audioCtx.resume();
          }

          const source = audioCtx.createMediaStreamSource(mediaStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          document.getElementById("startBtn").style.display = "none";
          document.getElementById("stopBtn").style.display = "inline-block";
          isListening = true;
          document.getElementById("pitchDisplay").innerText =
            "Listening active";

          const buf = new Float32Array(2048);
          function updatePitch() {
            if (!isListening) return;
            analyser.getFloatTimeDomainData(buf);
            let acPitch = autoCorrelate(buf, audioCtx.sampleRate);
            if (acPitch !== -1 && acPitch > 50 && acPitch < 2000) {
              document.getElementById("noteDisplay").innerText =
                getNoteName(acPitch);
              document.getElementById("pitchDisplay").innerText =
                Math.round(acPitch) + " Hz";
            }
            requestAnimationFrame(updatePitch);
          }
          updatePitch();
        } catch (err) {
          document.getElementById("pitchDisplay").innerText =
            "Error: " + err.message;
        }
      };

      window.stopAudio = function () {
        isListening = false;
        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        if (audioCtx) audioCtx.close();
        document.getElementById("noteDisplay").innerText = "--";
        document.getElementById("pitchDisplay").innerText =
          "Click to start listener";
        document.getElementById("startBtn").style.display = "inline-block";
        document.getElementById("stopBtn").style.display = "none";
      };
    </script>
  </body>
</html>
